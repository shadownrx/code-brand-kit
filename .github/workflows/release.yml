name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: node --test tests/patch.test.js
      - run: python scripts/build.py
      - run: python scripts/bundle.py
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.vsix dist/*.zip dist/SHA256SUMS.txt --title "Code Brand Kit $GITHUB_REF_NAME" --generate-notes
